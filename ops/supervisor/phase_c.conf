; =========================================================================
;  F-TRADE v2 — Phase C REAL REGIME RUN (supervisor-managed)
;  TRUTH lane — slow (15m), 9 symbols, 3 timeframes, shadow-only.
;  autorestart=true neutralizes sandbox silent-kill; state survives
;  via Mongo `generator_state` checkpoints (lane-isolated).
; =========================================================================
[program:phase_c]
command=/root/.venv/bin/python3 -u /app/backend/scripts/phase_b1_regime_collection.py --experiment phase_c_real_regime_run --horizon 4 --sleep-seconds 900 --max-cycles 0 --lane phase_c --log-tag [PHASE_C]
directory=/app/backend
autostart=true
autorestart=true
startsecs=10
startretries=99999
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/app/backend/logs/phase_c_out.log
stderr_logfile=/app/backend/logs/phase_c_err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
user=root
