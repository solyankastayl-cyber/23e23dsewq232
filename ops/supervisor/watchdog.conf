; =========================================================================
;  F-TRADE v2 — Phase C.1: Watchdog
;  health-check + force-resolve matured trades + snapshot
;  Runs every 60s. Tolerates transient backend unavailability.
; =========================================================================
[program:watchdog]
command=/root/.venv/bin/python3 -u /app/backend/scripts/watchdog.py
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
startretries=99999
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/app/backend/logs/watchdog_out.log
stderr_logfile=/app/backend/logs/watchdog_err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
user=root
