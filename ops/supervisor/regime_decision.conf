; =========================================================================
;  F-TRADE v2 — Phase C.3 Regime Decision Pipeline Scheduler
;  Runs analyze -> decide -> alert -> state-machine every INTERVAL seconds.
;  READ/ANALYZE ONLY. Does NOT change trading logic, detectors, or routers.
; =========================================================================
[program:regime_decision]
command=/root/.venv/bin/python3 -u /app/backend/scripts/regime_decision_scheduler.py
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
startretries=99999
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",REGIME_DECISION_INTERVAL="900"
stdout_logfile=/app/backend/logs/regime_decision_out.log
stderr_logfile=/app/backend/logs/regime_decision_err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
user=root
