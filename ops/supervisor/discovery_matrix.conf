; =========================================================================
;  F-TRADE v2 — Phase C.2: Discovery Matrix Live (fast exploration lane)
;  EXPLORATORY lane — fast (3m), 30 symbols, 1H+4H only, shadow-only.
;  Separate experiment_id, separate generator_state lane (discovery:*).
;  verdict = exploratory_only (NEVER to be mixed with phase_c truth data).
; =========================================================================
[program:discovery_matrix]
command=/root/.venv/bin/python3 -u /app/backend/scripts/phase_b1_regime_collection.py --experiment discovery_matrix_live --horizon 4 --sleep-seconds 180 --max-cycles 0 --lane discovery --timeframes 1H,4H --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,TRXUSDT,DOTUSDT,MATICUSDT,LTCUSDT,UNIUSDT,ATOMUSDT,ETCUSDT,XLMUSDT,FILUSDT,APTUSDT,NEARUSDT,ICPUSDT,INJUSDT,SUIUSDT,TIAUSDT,ARBUSDT,OPUSDT,SEIUSDT,AAVEUSDT,HBARUSDT,ALGOUSDT --log-tag [DISCOVERY]
directory=/app/backend
autostart=true
autorestart=true
startsecs=10
startretries=99999
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/app/backend/logs/discovery_out.log
stderr_logfile=/app/backend/logs/discovery_err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
user=root
